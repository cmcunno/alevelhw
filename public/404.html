<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQA AS Biology 7401: MarkScheme Decoder & Self-Marking Lab</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects any deep path back to root URL while preserving relative paths
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // If deployed at username.github.io/repo-name/, keep repo-name
      const repoBase = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      window.location.replace(repoBase);
    </script>
  </head>
  <body>
    <p>Redirecting to MarkScheme Decoder & Self-Marking Lab...</p>
  </body>
</html>
